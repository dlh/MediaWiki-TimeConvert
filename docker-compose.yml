services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: mediawiki
      MARIADB_USER: mediawiki
      MARIADB_PASSWORD: mediawiki
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mediawiki-db:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 20

  mediawiki:
    image: mediawiki:1.43
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html/extensions/TimeConvert:ro
      - ./docker/entrypoint.sh:/docker/entrypoint.sh:ro
      - ./docker/LocalSettings.extra.php:/docker/LocalSettings.extra.php:ro
    command: [ "bash", "/docker/entrypoint.sh" ]

volumes:
  mediawiki-db:
